[project]
name = "focusloop-ml"
version = "0.1.0"
description = "Offline training, evaluation and brain-content precompute for FocusLoop (runs on the Mac only)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "pandas==2.2.2",
  "scikit-learn==1.5.1",
  "torch==2.5.0",
  "coremltools==8.3.0",
  "matplotlib==3.10.3",
  "nibabel==5.3.2",
  "nilearn==0.11.1",
  "jsonschema==4.24.0",
  "pytest==8.4.0",
]
[tool.uv]
package = false
